# Weekly update PRs for everything this repository pins. Minor and patch
# updates come grouped, one PR per ecosystem and directory; majors come one PR
# each. Every PR runs the full CI. Tools pinned in the Makefile (buf,
# protoc-gen-go, golangci-lint) and govulncheck in checks.yml are not seen here.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # The build and runtime images in the Dockerfile (digest-pinned).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]

  # The Caddy image in the example stack (digest-pinned). The obsync image
  # there follows OBSYNC_VERSION and is not pinned.
  - package-ecosystem: docker-compose
    directory: /deploy/compose/single-node
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      compose-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /plugin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Node's types follow the Node the plugin is developed and tested on (.nvmrc).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      plugin-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /plugin/lint
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Exit trigger for the two TypeScript compilers: fold plugin/lint back
      # into plugin/ when typescript-eslint supports TypeScript 7 (expected
      # with TS 7.1's API); until then the lint package stays on TS 5.x.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      lint-minor-and-patch:
        update-types: [minor, patch]
