name: Release

# A tag X.Y.Z (no "v") that matches manifest.json publishes, all together: the
# plugin files Obsidian installs from, the headless client obsync-cli.mjs, the
# server binaries (Linux, macOS and Windows), and the container image. Nothing is
# published until every CI check (checks.yml) and the
# 1,000-seed convergence suite have passed.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/obsync

jobs:
  verify:
    name: The tag matches the manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The script's own tests run in checks, before anything is published.
      - run: scripts/check-release-version.sh "$GITHUB_REF_NAME"

  # Every check ci.yml runs, from the same workflow: the tag may point at a
  # commit CI never saw.
  checks:
    name: Checks
    needs: verify
    uses: ./.github/workflows/checks.yml

  convergence:
    name: Convergence suite (1,000 seeds)
    needs: verify
    uses: ./.github/workflows/convergence.yml
    with:
      seeds: "1000"

  binary-linux:
    name: Linux binary (${{ matrix.arch }})
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The same build stage as the image, cross-compiled: no emulation.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: binary
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ github.ref_name }}
          outputs: type=local,dest=out
      - name: The binary is static
        run: |
          if readelf -lW out/obsync | grep -q 'program interpreter'; then
            echo "out/obsync is dynamically linked" >&2; exit 1
          fi
      - name: Package
        run: |
          name="obsync_${GITHUB_REF_NAME}_linux_${{ matrix.arch }}"
          mkdir -p "pkg/$name"
          cp out/obsync LICENSE README.md "pkg/$name/"
          cp -r deploy "pkg/$name/deploy"
          tar -czf "$name.tar.gz" -C pkg "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binary-linux-${{ matrix.arch }}
          path: obsync_*.tar.gz
          if-no-files-found: error

  # macOS (amd64, arm64) and Windows (amd64), each built and smoke-run on a
  # runner of its own system.
  binaries:
    name: macOS and Windows binaries
    needs: verify
    uses: ./.github/workflows/binaries.yml
    with:
      version: ${{ github.ref_name }}
      upload: true

  plugin:
    name: Plugin files and obsync-cli
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: make plugin-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plugin
          path: |
            plugin/dist/main.js
            plugin/dist/manifest.json
            plugin/dist/styles.css
          if-no-files-found: error
      # The headless client: one file for Node 22.12+, every dependency inlined.
      - run: make cli-build
      - name: obsync-cli starts and carries this version
        run: test "$(node plugin/dist/obsync-cli.mjs --version)" = "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-cli
          path: plugin/dist/obsync-cli.mjs
          if-no-files-found: error

  image:
    name: Container image
    # Pushing the image is publishing: not before the tests, the convergence suite
    # and the other release files have all passed, so a failure leaves nothing half published.
    needs: [verify, checks, convergence, binary-linux, binaries, plugin]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Build provenance for the pushed image.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # latest is moved by the publish job, after the release exists.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Signed SLSA build provenance, pushed next to the image:
      # gh attestation verify oci://ghcr.io/jfms7s/obsync:X.Y.Z --repo jfms7s/obsidian-sync
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false

  publish:
    name: Publish the release
    needs: [checks, convergence, binary-linux, binaries, plugin, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      # Build provenance for the release files.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Only this release's files: the convergence reports have other names.
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: |
          cd dist
          ls -l
          sha256sum -- * > SHA256SUMS
      # Signed SLSA build provenance for every file, before any is published:
      # gh attestation verify main.js --repo jfms7s/obsidian-sync
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only the highest release is latest: re-tagging an older patch must not
      # move it backwards.
      - name: Move latest to this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          highest="$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags" --jq '.[].name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [ "$highest" != "$GITHUB_REF_NAME" ]; then
            echo "latest stays where it is: $GITHUB_REF_NAME is older than $highest"
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:${GITHUB_REF_NAME}"
