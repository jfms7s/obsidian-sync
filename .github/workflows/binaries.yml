name: Binaries

# The macOS and Windows server binaries. The server is pure Go
# (CGO_ENABLED=0), so each one is built on a runner of its own system and
# smoke-run there. The Linux binaries come from the image's build stage
# (release.yml, ci.yml). ci.yml builds these on every push and pull request;
# release.yml builds and uploads them for the release.
on:
  workflow_call:
    inputs:
      version:
        description: The version the binaries print (main.version)
        type: string
        required: true
      upload:
        description: Package each binary and upload it as a release-* artifact
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  binary:
    name: ${{ matrix.goos }}/${{ matrix.goarch }} binary
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64, runner: macos-15 }
          - { goos: darwin, goarch: amd64, runner: macos-15-intel }
          - { goos: windows, goarch: amd64, runner: windows-2025 }
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      VERSION: ${{ inputs.version }}
      EXE: ${{ matrix.goos == 'windows' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build
        run: |
          cd server
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "../out/obsync${EXE}" ./cmd/obsync
      - name: Smoke-run
        run: |
          got="$("out/obsync${EXE}" version | tr -d '\r')"
          echo "$got"
          test "$got" = "obsync ${VERSION}"
      - name: Package
        if: inputs.upload
        run: |
          name="obsync_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "pkg/$name"
          cp "out/obsync${EXE}" LICENSE README.md "pkg/$name/"
          if [ "$GOOS" = windows ]; then
            (cd pkg && 7z a -tzip "../$name.zip" "$name")
          else
            tar -czf "$name.tar.gz" -C pkg "$name"
          fi
      - if: inputs.upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            obsync_*.tar.gz
            obsync_*.zip
          if-no-files-found: error
