name: Checks

# The tests, lint, generated-code and protocol checks, and the release script
# tests. ci.yml runs them on every push and pull request, and release.yml runs
# them on the tag before anything is published, so both run the same checks.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go tests and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Show the toolchain the module selects
        run: |
          cd server
          go version
          grep '^toolchain' go.mod
      - run: cd server && go vet ./...
      # The test run and the coverage run are one run: report-only telemetry, but a
      # failing test still fails the job, and the fragment is only moved into
      # .quality/ after a green run. quality-report maps the import paths in the
      # profile to files through go.mod. Go code that only the plugin's server
      # tests exercise is not counted (known gap).
      - name: Go tests with coverage (eng-metrics-lab)
        run: |
          cd server
          go test -race -covermode=atomic -coverpkg=./... -coverprofile="$RUNNER_TEMP/coverage-go.out" ./...
          mkdir -p ../.quality
          mv "$RUNNER_TEMP/coverage-go.out" ../.quality/coverage-go.out
      # Report-only: release.yml needs this workflow, so a failed upload must not block a release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: coverage-fragments-go
          path: .quality/coverage-go.out
          include-hidden-files: true
          retention-days: 7
      # Known vulnerabilities in the Go code, its modules and the standard library
      # it calls. It must check the standard library of the toolchain go.mod
      # names, the one the binary ships with, and be built by that toolchain
      # (one built by an older Go cannot type-check a newer standard library).
      # go run picks a toolchain from govulncheck's own go.mod, so GOTOOLCHAIN
      # pins the server's. Not seen by Dependabot: bump it by hand.
      - name: govulncheck
        run: |
          cd server
          GOTOOLCHAIN="$(go env GOVERSION)" go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: server

  plugin:
    name: Plugin typecheck, tests, lint and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The plugin's server tests build and start the real obsync binary.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            plugin/package-lock.json
            plugin/lint/package-lock.json
      # make plugin-test (typecheck, then the unit and server tests) with coverage on
      # the second half; the convergence suite is skipped as before. The relative
      # SF: paths vitest writes get the package directory put in front, so they are
      # repo-relative. cli/ is shipped code with its own tests, so it is included
      # next to src/.
      - run: make plugin/node_modules
      - run: cd plugin && npm run typecheck
      - name: Plugin tests with coverage (eng-metrics-lab)
        run: |
          cd plugin
          npx vitest run --project '!convergence' --coverage.enabled --coverage.provider=v8 --coverage.reporter=lcovonly --coverage.reportsDirectory="$RUNNER_TEMP/coverage-ts" '--coverage.include=src/**' '--coverage.include=cli/**'
          mkdir -p ../.quality
          sed 's|^SF:\([^/]\)|SF:plugin/\1|' "$RUNNER_TEMP/coverage-ts/lcov.info" > "$RUNNER_TEMP/coverage-ts.lcov"
          mv "$RUNNER_TEMP/coverage-ts.lcov" ../.quality/coverage-ts.lcov
      # Report-only: release.yml needs this workflow, so a failed upload must not block a release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: coverage-fragments-ts
          path: .quality/coverage-ts.lcov
          include-hidden-files: true
          retention-days: 7
      - run: make plugin-lint
      - run: make plugin-build
      - name: The bundle needs nothing but obsidian
        run: |
          ! grep -oE 'require\("[^"]+"\)' plugin/dist/main.js | grep -v 'require("obsidian")'
      # The headless client (plugin/cli/): its tests run in make plugin-test; this builds the
      # file a release attaches and checks that it starts under the Node the repo pins.
      - run: make cli-build
      - name: The CLI bundle runs
        run: |
          node plugin/dist/obsync-cli.mjs --version
          node plugin/dist/obsync-cli.mjs --help > /dev/null

  generated:
    name: Generated code and test vectors are up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: make tools proto vectors
      - name: Nothing changed
        run: |
          test -z "$(git status --porcelain)" || { git status --porcelain; git diff; exit 1; }

  protocol:
    name: Protocol lint and compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # On a pull request: the commit the branch left main at. On a release tag:
      # the previous release, so a release can't break the one before it. On a
      # push to main there is nothing to compare with (the pull request did it).
      - name: Find what the protocol must stay compatible with
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "sha=$(git merge-base "origin/$BASE_REF" HEAD)" >> "$GITHUB_OUTPUT"
          elif [ "$REF_TYPE" = tag ]; then
            if previous=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' "${GITHUB_SHA}^" 2>/dev/null); then
              echo "previous release: $previous"
              echo "sha=$(git rev-list -n 1 "$previous")" >> "$GITHUB_OUTPUT"
            else
              echo "no earlier release: nothing to compare with"
            fi
          fi
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          # The same buf as the generated job and the Makefile, not the latest.
          version: 1.47.2
          # Commenting needs pull-requests: write; the results are in the job log.
          pr_comment: false
          lint: true
          format: false
          breaking: ${{ steps.base.outputs.sha != '' }}
          breaking_against: ".git#ref=${{ steps.base.outputs.sha }}"
          # Publishing to the Buf Schema Registry is not used.
          push: false
          archive: false

  scripts:
    name: Release scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-release-version_test.sh
