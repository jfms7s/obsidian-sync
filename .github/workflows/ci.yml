name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same checks run before every release (release.yml).
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  convergence:
    name: Convergence suite (100 seeds)
    uses: ./.github/workflows/convergence.yml
    with:
      seeds: "100"

  binaries:
    name: macOS and Windows binaries
    uses: ./.github/workflows/binaries.yml
    with:
      version: ci-${{ github.sha }}

  image:
    name: Image for both platforms, and the binaries inside
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The binary stage for both platforms, from the same gha cache as the image.
      - name: Build the Linux binaries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: binary
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=ci-${{ github.sha }}
          outputs: type=local,dest=out
          cache-from: type=gha
      # The server is pure Go: a binary with a program interpreter (a dynamic
      # loader) would need a libc the distroless/static image does not have.
      - name: The Linux binaries are static
        run: |
          ls out/*/obsync
          test "$(ls out/*/obsync | wc -l)" -eq 2
          for bin in out/*/obsync; do
            if readelf -lW "$bin" | grep -q 'program interpreter'; then
              echo "$bin is dynamically linked" >&2; exit 1
            fi
          done

  # Report-only: never gates the build; fragments feed the quality-report image.
  quality:
    name: Code quality (report-only, eng-metrics-lab)
    # Waits for the checks, which write the coverage fragments; still runs when
    # they fail (the report then has no coverage), but not when cancelled.
    needs: [checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Dead code, Go (deadcode)
        run: |
          mkdir -p .quality
          cd server && go run golang.org/x/tools/cmd/deadcode@v0.52.0 -json ./... > ../.quality/deadcode-go.json
        continue-on-error: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Install plugin dependencies
        working-directory: plugin
        run: npm ci
        continue-on-error: true
      - name: Dead code, TypeScript (knip)
        run: |
          mkdir -p .quality
          cd plugin && npx --yes knip@5.88.1 --reporter json --no-exit-code > ../.quality/deadcode-ts.json
        continue-on-error: true
      # The fragments the checks workflow uploaded (Go and TypeScript coverage). Same
      # workflow run, so artifacts of the called workflow are visible here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-fragments-*
          merge-multiple: true
          path: .quality
        continue-on-error: true
      - name: Code quality (report-only)
        uses: jfms7s/eng-metrics-lab/action@v0
        continue-on-error: true
