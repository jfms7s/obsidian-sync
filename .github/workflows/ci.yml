name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same checks run before every release (release.yml).
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  convergence:
    name: Convergence suite (100 seeds)
    uses: ./.github/workflows/convergence.yml
    with:
      seeds: "100"

  image:
    name: Image for both platforms, and the binaries inside
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The Linux binaries need no newer glibc than the runtime image has
        run: |
          for arch in amd64 arm64; do
            docker buildx build --target binary --platform "linux/$arch" --output "type=local,dest=out/$arch" .
            scripts/check-glibc.sh "out/$arch/obsync"
          done
